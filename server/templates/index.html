<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UART RT</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #0f0;
      font-family: monospace;
    }
    #wrap {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    #top {
      padding: 6px 10px;
      font-size: 14px;
      white-space: pre;
      user-select: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #000;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="top">Conectando...</div>
    <canvas id="c"></canvas>
  </div>

  <script>
    const socket = io();

    const topEl = document.getElementById('top');
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });

    const CAP = 4096;                 // buffer circular
    const values = new Float32Array(CAP);
    const times = new Float64Array(CAP);
    let head = 0;
    let count = 0;

    let lastValue = 0;
    let lastArrival = 0;
    let instHz = 0;
    let avgHz = 0;
    let minV = Infinity;
    let maxV = -Infinity;

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.floor(canvas.clientWidth * dpr);
      canvas.height = Math.floor(canvas.clientHeight * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function pushSample(v, t) {
      values[head] = v;
      times[head] = t;
      head = (head + 1) % CAP;
      if (count < CAP) count++;

      lastValue = v;
      if (v < minV) minV = v;
      if (v > maxV) maxV = v;

      if (lastArrival !== 0) {
        const dt = t - lastArrival;
        if (dt > 0) instHz = 1000 / dt;
      }
      lastArrival = t;

      // promedio sobre las últimas 64 muestras
      const N = Math.min(count, 500);
      if (N >= 2) {
        let t0 = times[(head - N + CAP) % CAP];
        let t1 = times[(head - 1 + CAP) % CAP];
        const span = t1 - t0;
        if (span > 0) avgHz = 1000 * (N - 1) / span;
      }
    }

    function draw() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;

      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, w, h);

      // texto mínimo
      ctx.fillStyle = '#0f0';
      ctx.font = '14px monospace';
      ctx.fillText(
        `samples=${count}  Hz_avg=${avgHz.toFixed(2)}`,
        8, 18
      );

      if (count < 2) return;

      // Copiar buffer en orden temporal sin alloc grande por frame
      const n = count;
      const start = (head - n + CAP) % CAP;

      let localMin = Infinity;
      let localMax = -Infinity;

      for (let i = 0; i < n; i++) {
        const v = values[(start + i) % CAP];
        if (v < localMin) localMin = v;
        if (v > localMax) localMax = v;
      }

      const range = (localMax - localMin) || 1;
      const padTop = 28;
      const padBottom = 8;
      const plotH = h - padTop - padBottom;

      ctx.strokeStyle = '#0f0';
      ctx.lineWidth = 1;
      ctx.beginPath();

      for (let i = 0; i < n; i++) {
        const v = values[(start + i) % CAP];
        const x = (i * (w - 1)) / (n - 1);
        const y = padTop + (localMax - v) * (plotH / range);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }

      ctx.stroke();
    }

    socket.on('connect', () => {
      topEl.textContent = 'Conectado';
    });

    socket.on('disconnect', () => {
      topEl.textContent = 'Desconectado';
    });

    socket.on('uart_data', (payload) => {
      const t = performance.now();
      try {
        const s = payload && payload.data ? payload.data : '';
        const obj = JSON.parse(s);
        const v = Number(obj.v);
        if (Number.isFinite(v)) {
          pushSample(v, t);
        }
      } catch (e) {
        // ignora líneas inválidas
      }
    });

    window.addEventListener('resize', resize);
    resize();

    function loop() {
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
